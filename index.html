<style>
/* Layout: barra superior com abas; cada aba é uma mesa de trabalho (filtros → resumo → tabela). Fechamento quinzenal é a aba inicial. */
:root{

}

  --cinza-barra:#3A3D4A; --cinza-rosca:#4A4D5A;
  --bg:#14161F; --surface:#1E2130; --field:#262A3B; --line:#2E3140; --fg:#E2E2E2; --muted:#A8A8A8; --title:#E8ECF8;
  --accent:#8FA3E8; --accent-ink:#14161F; --accent-soft:#3A1A2E;
  --ok:#4CC27E; --ok-soft:#173326; --warn:#FF3FA4; --warn-soft:#3A1A2E; --bad:#F0686B; --bad-soft:#3A1C1F;
  --s1:#FF3FA4; --s2:#8FA3E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --magenta:#FF3FA4; --magenta-claro:#7A1F52; --marinho:#8FA3E8; --marinho-escuro:#E8ECF8; --marinho-claro:#6E76A0;

  --s1:#FF3FA4; --s2:#8FA3E8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}

.sub{color:var(--muted);margin:2px 0 0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}

/* ---- Paleta magenta + marinho: ajustes de componentes ---- */

button{border-radius:4px}

function rodape(ac){ const r=$('rodapeInfo'); if(!r) return; r.innerHTML=''; const t=document.createElement('span'); t.textContent='Conectado como '+(ac.nome||ac.email)+' ('+({master:'MASTER',operacional:'Operacional',consultor:'Consultor'}[ac.perfil]||ac.perfil)+') · '; const a=document.createElement('a'); a.textContent='Sair'; a.style.cursor='pointer'; a.onclick=async()=>{ await sb.auth.signOut(); location.reload(); }; r.append(t,a); }

function criarDb(){
  const cols={}, ouvintes={};
  const snap=c=>({docs:[...(cols[c]||new Map()).entries()].map(([id,d])=>({id,data:()=>d}))});
  const avisa=c=>(ouvintes[c]||[]).forEach(fn=>{ try{ fn(snap(c)); }catch(e){ console.error(e); } });
  async function carrega(c){ const m=new Map(); for(let de=0;;de+=500){ const {data,error}=await sb.from('docs').select('id,data').eq('colecao',c).range(de,de+499); if(error) throw error; data.forEach(r=>m.set(r.id,r.data)); if(data.length<500) break; } cols[c]=m; avisa(c); }
  const carregando={};
  const ch=sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.new&&p.new.colecao?p.new:p.old; if(!r||!r.colecao) return; const c=r.colecao; cols[c]=cols[c]||new Map();
    if(p.eventType==='DELETE') cols[c].delete(p.old.id); else cols[c].set(p.new.id,p.new.data);
    avisa(c);
  }).subscribe();
  function onSnap(c,fn,err){ (ouvintes[c]=ouvintes[c]||[]).push(fn); if(cols[c]) fn(snap(c)); else if(!carregando[c]) carregando[c]=carrega(c).catch(e=>{ console.error(e); err&&err(e); }); return ()=>{ ouvintes[c]=ouvintes[c].filter(x=>x!==fn); }; }
  const recusa=(c,err)=>{ carrega(c).catch(()=>{}); setTimeout(()=>window.__rbac.aviso('Sem permissão para esta ação. Os dados foram recarregados.'),80); const e=err||new Error('sem permissão'); e.code=e.code||'sem_permissao'; throw e; };
  async function grava(c,id,body){ const existia=!!(cols[c]&&cols[c].has(id)); (cols[c]=cols[c]||new Map()).set(id,body);
    const upd=()=>sb.from('docs').update({data:body}).eq('colecao',c).eq('id',id).select('id');
    let r = existia ? await upd() : await sb.from('docs').insert({colecao:c,id,data:body}).select('id');
    if(!existia && r.error && r.error.code==='23505') r = await upd();
    if(r.error||!r.data||!r.data.length) recusa(c,r.error); }
  async function apaga(c,id){ cols[c]&&cols[c].delete(id); const r=await sb.from('docs').delete().eq('colecao',c).eq('id',id).select('id'); if(r.error||!r.data||!r.data.length) recusa(c,r.error); }
  return {
    collection:c=>({onSnapshot:(fn,err)=>onSnap(c,fn,err)}),
    doc:path=>{ const [c,id]=path.split('/'); return {
      set:body=>grava(c,id,body), delete:()=>apaga(c,id),
      onSnapshot:(fn,err)=>onSnap(c,s=>{ const d=s.docs.find(x=>x.id===id); fn({exists:!!d,data:()=>d?d.data():undefined}); },err) }; },
    importar:async(c,lista)=>{ for(let i=0;i<lista.length;i+=25){ const lote=lista.slice(i,i+25).map(x=>({colecao:c,id:String(x.id),data:x.data})); const {error}=await sb.from('docs').upsert(lote); if(error) throw error; } await carrega(c); }
  };
}

/* ---------- controle de acesso (perfis MASTER / Operacional / Consultor) ---------- */
window.__rbac = (function(){
  const MODS = [['painel','Painel'],['agregados','Agregados'],['locacoes','Locações'],['feriados','Feriados'],['fechamentos','Fechamentos'],['custos','Custos avulsos'],['frequencia','Frequência'],['nfs','Notas fiscais (NFS)'],['adiantamentos','Adiantamentos']];
  const PERFIS = {master:'MASTER', operacional:'Operacional', consultor:'Consultor'};
  const TAB_MOD = {fechamento:['fechamentos','criar'], historico:['fechamentos','ver'], custos:['custos','ver'], painel:['painel','ver'],
    agregados:['agregados','ver'], locacoes:['locacoes','ver'], feriados:['feriados','ver'], frequencia:['frequencia','ver'], nfs:['nfs','ver'], adiant:['adiantamentos','ver'], usuarios:['usuarios','ver']};
  const ORDEM = ['fechamento','historico','custos','painel','agregados','locacoes','feriados','frequencia','nfs','adiant','usuarios'];
  // seletor -> [módulo, ação]. Sem a permissão: o elemento some e o clique é barrado.
  const REGRAS = [
    ['[data-tab="fechamento"],[data-act="fecharPend"],[data-act="irNovo"],[data-act="gravar"]','fechamentos','criar'],
    ['[data-act="askLote"],[data-act="askItem"],[data-act="delFech"],[data-act="delFechYes"],[data-act="delYes2"]','fechamentos','excluir'],
    ['[data-tab="historico"]','fechamentos','ver'],
    ['[data-tab="custos"]','custos','ver'],
    ['#cform,[data-act="abrirColar"],[data-act="importarColar"]','custos','criar'],
    ['[data-act="editCusto"]','custos','editar'],
    ['[data-act="delCusto"],[data-act="delCustoYes"]','custos','excluir'],
    ['[data-tab="painel"]','painel','ver'],
    ['[data-tab="agregados"]','agregados','ver'], ['[data-act="novoAg"]','agregados','criar'],
    ['[data-tab="locacoes"]','locacoes','ver'], ['[data-act="novaLoc"]','locacoes','criar'],
    ['[data-tab="feriados"]','feriados','ver'], ['[data-act="novoFer"]','feriados','criar'],
    ['[data-tab="frequencia"]','frequencia','ver'], ['[data-tab="nfs"]','nfs','ver'], ['[data-tab="adiant"]','adiantamentos','ver'],
    ['[data-act="delAsk"],[data-act="delYes"]','usuarios','excluir'],
    ['[data-tab="usuarios"],[data-act="backupExp"],[data-act="backupImp"]','usuarios','ver']
  ];
  let AC = null;
  const pode = (m,a) => !!(AC && AC.perm && AC.perm[m] && AC.perm[m][a]);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function aviso(t){ const el=document.getElementById('toast'); if(!el) return; el.textContent=t; el.hidden=false; clearTimeout(aviso._t); aviso._t=setTimeout(()=>el.hidden=true,3200); }
  function bloqueia(e){ e.preventDefault(); e.stopImmediatePropagation(); aviso('Sem permissão para esta ação'); }

  function aplicar(ac){
    AC = ac;
    const off = REGRAS.filter(([,m,a]) => !pode(m,a)).map(r => r[0]);
    let st = document.getElementById('rbacCss'); if(!st){ st=document.createElement('style'); st.id='rbacCss'; document.head.appendChild(st); }
    st.textContent = (off.length ? off.join(',')+'{display:none!important}' : '')
      + '#modalRoot[data-rb-lock] button[type="submit"],#modalRoot[data-rb-lock] [data-edadd],#modalRoot[data-rb-lock] [data-eddel]{display:none!important}'
      + '#modalRoot[data-rb-lock] [data-edday]{pointer-events:none}'
      + '.rb-lock-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:6px 10px}';
    escutarMudancas();
  }

  // abre o cadastro só para leitura quando o perfil não pode editar
  function travarModal(){
    const mr=document.getElementById('modalRoot'); if(!mr||!mr.innerHTML) return;
    mr.dataset.rbLock='1';
    mr.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(el=>el.disabled=true);
    const f=mr.querySelector('form'); if(f && !f.querySelector('.rb-lock-note')){ const n=document.createElement('div'); n.className='rb-lock-note'; n.textContent='Somente leitura: seu perfil não pode editar este cadastro.'; const h=f.querySelector('h3'); if(h) h.after(n); else f.prepend(n); }
  }
  new MutationObserver(()=>{ const mr=document.getElementById('modalRoot'); if(mr && !mr.innerHTML) delete mr.dataset.rbLock; })
    .observe(document.getElementById('modalRoot') || document.body, {childList:true});

  document.addEventListener('click', e=>{
    if(!AC) return;
    const mr=document.getElementById('modalRoot');
    if(mr && mr.dataset.rbLock && mr.contains(e.target) && e.target.closest('[data-edday],[data-edadd],[data-eddel],[data-act="delAsk"],[data-act="delYes"],button[type="submit"]')) return bloqueia(e);
    const t=e.target.closest && e.target.closest('[data-act],[data-tab]');
    if(t) for(const [sel,m,a] of REGRAS){ if(t.matches(sel) && !pode(m,a)) return bloqueia(e); }
    const ed=e.target.closest && e.target.closest('[data-edit-ag],[data-edit-loc],[data-edit-fer],[data-edfech]');
    if(ed){ const m = 'editAg' in ed.dataset ? 'agregados' : 'editLoc' in ed.dataset ? 'locacoes' : 'editFer' in ed.dataset ? 'feriados' : 'fechamentos';
      if(!pode(m,'editar')) setTimeout(travarModal,0); }
  }, true);
  document.addEventListener('submit', e=>{
    if(!AC) return; const f=e.target;
    if(f.id==='cform' && !pode('custos','criar')) return bloqueia(e);
    if(f.id==='dlg'){
      const mr=document.getElementById('modalRoot'); if(mr && mr.dataset.rbLock) return bloqueia(e);
      const k=(document.getElementById('m_kind')||{}).value, id=(document.getElementById('m_id')||{}).value;
      const m={ag:'agregados',loc:'locacoes',fer:'feriados',custo:'custos',edfech:'fechamentos'}[k];
      if(m && !pode(m, (k==='edfech'||id) ? 'editar' : 'criar')) return bloqueia(e);
    }
  }, true);

  function primeiraAba(cur){
    const ok = t => { const r=TAB_MOD[t]; return r && pode(r[0], r[1]); };
    if(ok(cur)) return cur; return ORDEM.find(ok) || 'semacesso';
  }
  const usaPainelRpc = () => pode('painel','ver') && !(pode('fechamentos','ver') && pode('custos','ver') && pode('locacoes','ver'));
  async function painelDados(){ const {data,error}=await sb.rpc('painel_dados'); if(error) throw error; return data; }

  // perfil ou grade alterados enquanto a pessoa está conectada
  let escutando=false, tRe=null;
  function escutarMudancas(){
    if(escutando) return; escutando=true;
    const re=()=>{ clearTimeout(tRe); tRe=setTimeout(async()=>{
      const {data}=await sb.rpc('meu_acesso');
      if(!data){ aviso('Seu acesso foi encerrado.'); setTimeout(async()=>{ await sb.auth.signOut(); location.reload(); },1500); return; }
      if(JSON.stringify(data.perm)!==JSON.stringify(AC.perm) || data.perfil!==AC.perfil){ aviso('Seu acesso foi atualizado. Recarregando…'); setTimeout(()=>location.reload(),1500); }
    },700); };
    sb.channel('acesso').on('postgres_changes',{event:'*',schema:'public',table:'membros'},re)
      .on('postgres_changes',{event:'*',schema:'public',table:'permissoes'},re).subscribe();
  }

  /* ---------- aba Usuários e acessos (só MASTER) ---------- */
  const U = {root:null, users:[], grade:[], audit:[], msg:'', erro:false, carregando:true, form:{nome:'',email:'',perfil:'operacional'}};
  const traduz = e => { const m=(e&&e.message)||String(e||''); if(/duplicate key|23505/i.test(m)||(e&&e.code==='23505')) return 'Este e-mail já está cadastrado.'; return m.replace(/^.*?: /,'')||'Não foi possível concluir.'; };
  function situacao(u){
    if(!u.ativo) return '<span class="pill off">Inativo</span>';
    if(!u.tem_senha) return '<span class="pill warn">Convidado</span><div class="dim">ainda não criou a senha</div>';
    if(!u.confirmado) return '<span class="pill warn">Aguardando confirmação</span><div class="dim">não confirmou o e-mail</div>';
    return '<span class="pill ok">Ativo</span><div class="dim">'+(u.ultimo_acesso?'último acesso '+new Date(u.ultimo_acesso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'nunca entrou')+'</div>';
  }
  function convite(u){ return 'Olá, '+u.nome+'! Seu acesso ao Pagamento de Agregados foi liberado ('+(PERFIS[u.perfil]||u.perfil)+'). Abra '+location.origin+' , clique em "Primeiro acesso" e crie sua senha usando o e-mail '+u.email+'. Depois confirme pelo link que chegar no seu e-mail.'; }
  async function copiar(t){ try{ await navigator.clipboard.writeText(t); aviso('Convite copiado. Cole no WhatsApp ou e-mail da pessoa.'); }catch(e){ window.prompt('Copie o convite:', t); } }
  async function recarregar(){
    const [a,b,c]=await Promise.all([sb.rpc('usuarios_situacao'), sb.from('permissoes').select('perfil,modulo,ver,criar,editar'), sb.from('auditoria').select('quando,quem_email,tabela,chave,operacao').in('tabela',['membros','permissoes']).order('quando',{ascending:false}).limit(25)]);
    if(a.error) { U.msg=traduz(a.error); U.erro=true; }
    U.users=a.data||[]; U.grade=b.data||[]; U.audit=c.data||[]; U.carregando=false; desenhar();
  }
  const g = (perfil,mod) => U.grade.find(r=>r.perfil===perfil&&r.modulo===mod) || {perfil,modulo:mod,ver:false,criar:false,editar:false};
  function desenhar(){
    if(!U.root || !document.body.contains(U.root)) return;
    const masters=U.users.filter(u=>u.perfil==='master'&&u.ativo).length;
    const linhaU = u => `<tr>
      <td style="font-weight:600">${esc(u.nome)}</td><td class="mono">${esc(u.email)}</td>
      <td><select data-rb-perfil="${esc(u.email)}" style="width:auto">${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}" ${k===u.perfil?'selected':''}>${v}</option>`).join('')}</select></td>
      <td>${situacao(u)}</td>
      <td style="white-space:nowrap;text-align:right">
        <button type="button" data-rb-convite="${esc(u.email)}">Copiar convite</button>
        <button type="button" data-rb-ativo="${esc(u.email)}">${u.ativo?'Inativar':'Reativar'}</button>
        ${!u.tem_senha?`<button type="button" class="danger" data-rb-excluir="${esc(u.email)}">Excluir</button>`:''}
      </td></tr>`;
    const cb = (perfil,mod,acao,dis) => { const r=g(perfil,mod); return `<td class="n" style="text-align:center"><input type="checkbox" data-rb-perm="${perfil}|${mod}|${acao}" ${r[acao]?'checked':''} ${dis?'disabled':''} aria-label="${PERFIS[perfil]} ${acao} ${mod}"></td>`; };
    U.root.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
      ${U.msg?`<div class="notice ${U.erro?'warn':''}" style="display:block">${esc(U.msg)}</div>`:''}
      <div class="panel"><div class="ph"><div><h2>Usuários</h2><span style="color:var(--muted);font-size:12px">Só quem está cadastrado e ativo aqui consegue entrar. ${masters} MASTER ativo${masters===1?'':'s'}.</span></div></div>
        <form id="rb_form" class="qform" novalidate style="padding:0 14px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <label class="lbl" style="flex:1 1 200px">Nome<input id="rb_nome" value="${esc(U.form.nome)}" maxlength="80" autocomplete="off"></label>
          <label class="lbl" style="flex:1 1 240px">E-mail<input id="rb_email" type="email" value="${esc(U.form.email)}" autocomplete="off"></label>
          <label class="lbl" style="flex:0 0 170px">Perfil<select id="rb_perfil">${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}" ${k===U.form.perfil?'selected':''}>${v}</option>`).join('')}</select></label>
          <button class="primary" type="submit">Cadastrar usuário</button>
        </form>
        <div class="scroll"><table style="min-width:820px"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th></th></tr></thead>
        <tbody>${U.carregando?'<tr><td colspan="5" class="empty">Carregando…</td></tr>':U.users.length?U.users.map(linhaU).join(''):'<tr><td colspan="5" class="empty">Nenhum usuário.</td></tr>'}</tbody></table></div>
        <p class="sub" style="font-size:12px;padding:0 14px 12px">Depois de cadastrar, use “Copiar convite” e envie para a pessoa. Ela cria a senha em “Primeiro acesso” e confirma pelo e-mail que receber.</p>
      </div>
      <div class="panel"><div class="ph"><div><h2>Permissões por perfil</h2><span style="color:var(--muted);font-size:12px">Vale para todos os usuários do perfil e passa a valer na hora. MASTER sempre tem acesso total; excluir, backup, configurações e esta aba são só do MASTER.</span></div></div>
        <div class="scroll"><table style="min-width:620px"><thead>
          <tr><th rowspan="2">Módulo</th><th colspan="3" style="text-align:center">Operacional</th><th style="text-align:center">Consultor</th></tr>
          <tr><th style="text-align:center">Ver</th><th style="text-align:center">Criar</th><th style="text-align:center">Editar</th><th style="text-align:center">Ver</th></tr></thead>
        <tbody>${MODS.map(([m,n])=>`<tr><td style="font-weight:600">${n}</td>${cb('operacional',m,'ver')}${cb('operacional',m,'criar',m==='painel')}${cb('operacional',m,'editar',m==='painel')}${cb('consultor',m,'ver')}</tr>`).join('')}</tbody></table></div>
        <p class="sub" style="font-size:12px;padding:0 14px 12px">Ao liberar Criar ou Editar em Fechamentos, Ver em Agregados, Locações e Feriados é ligado automaticamente (o cálculo precisa deles). O mesmo vale para Custos avulsos com Agregados e Locações, e para Frequência, Notas fiscais e Adiantamentos com Agregados, Locações e Feriados.</p>
      </div>
      <div class="panel"><div class="ph"><h2>Últimas alterações de acesso</h2></div>
        <div class="scroll"><table style="min-width:620px"><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>Ação</th></tr></thead>
        <tbody>${U.audit.length?U.audit.map(a=>`<tr><td class="mono">${new Date(a.quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(a.quem_email||'sistema')}</td><td>${a.tabela==='membros'?'Usuário ':'Permissão '}<span class="mono">${esc(a.chave)}</span></td><td>${{INSERT:'incluído',UPDATE:'alterado',DELETE:'excluído'}[a.operacao]||esc(a.operacao)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhuma alteração ainda.</td></tr>'}</tbody></table></div></div>
    </div>`;
  }
  const feito = (t) => { U.msg=t; U.erro=false; recarregar(); };
  const falhou = (e) => { U.msg=traduz(e); U.erro=true; recarregar(); };
  function montarUsuarios(v){
    const root=document.createElement('div'); root.id='rbacRoot'; v.appendChild(root); U.root=root; U.msg=''; U.carregando=true; desenhar();
    root.addEventListener('input', e=>{ const id=e.target.id; if(id==='rb_nome') U.form.nome=e.target.value; else if(id==='rb_email') U.form.email=e.target.value; });
    root.addEventListener('change', async e=>{
      const el=e.target;
      if(el.id==='rb_perfil'){ U.form.perfil=el.value; return; }
      if(el.dataset.rbPerfil){ const email=el.dataset.rbPerfil, p=el.value, u=U.users.find(x=>x.email===email);
        if(p==='master' && !confirm(u.nome+' terá acesso total, incluindo usuários e exclusões. Confirmar?')){ desenhar(); return; }
        const {error}=await sb.from('membros').update({perfil:p}).eq('email',email);
        return error?falhou(error):feito(u.nome+' agora é '+PERFIS[p]+'.'); }
      if(el.dataset.rbPerm){ const [perfil,mod,acao]=el.dataset.rbPerm.split('|'); const r={...g(perfil,mod)}; r[acao]=el.checked;
        if(acao==='ver'&&!el.checked){ r.criar=false; r.editar=false; } if(acao!=='ver'&&el.checked) r.ver=true;
        const {error}=await sb.from('permissoes').upsert({perfil,modulo:mod,ver:r.ver,criar:r.criar,editar:r.editar},{onConflict:'perfil,modulo'});
        return error?falhou(error):feito('Permissão de '+PERFIS[perfil]+' atualizada.'); }
    });
    root.addEventListener('click', async e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.rbConvite){ const u=U.users.find(x=>x.email===b.dataset.rbConvite); if(u) copiar(convite(u)); return; }
      if(b.dataset.rbAtivo){ const u=U.users.find(x=>x.email===b.dataset.rbAtivo); const {error}=await sb.from('membros').update({ativo:!u.ativo}).eq('email',u.email); return error?falhou(error):feito(u.nome+(u.ativo?' foi inativado.':' foi reativado.')); }
      if(b.dataset.rbExcluir){ const u=U.users.find(x=>x.email===b.dataset.rbExcluir); if(!confirm('Excluir o cadastro de '+u.nome+'?')) return; const {error}=await sb.from('membros').delete().eq('email',u.email); return error?falhou(error):feito(u.nome+' foi excluído.'); }
    });
    root.addEventListener('submit', async e=>{
      if(e.target.id!=='rb_form') return; e.preventDefault(); e.stopPropagation();
      const nome=U.form.nome.trim(), email=U.form.email.trim().toLowerCase(), perfil=U.form.perfil;
      if(nome.length<2){ U.msg='Informe o nome (pelo menos 2 letras).'; U.erro=true; return desenhar(); }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ U.msg='Informe um e-mail válido.'; U.erro=true; return desenhar(); }
      if(perfil==='master' && !confirm(nome+' terá acesso total, incluindo usuários e exclusões. Confirmar?')) return;
      const {error}=await sb.from('membros').insert({nome,email,perfil,ativo:true});
      if(error) return falhou(error);
      U.form={nome:'',email:'',perfil:'operacional'}; copiar(convite({nome,email,perfil})); feito(nome+' foi cadastrado como '+PERFIS[perfil]+'. O convite foi copiado.');
    });
    recarregar();
  }
  return {aplicar, aviso, primeiraAba, usaPainelRpc, painelDados, montarUsuarios, pode, ac:()=>AC};
})();

window.__conectar = () => new Promise(resolve=>{
  let pronto=false;
  async function entrar(session){
    if(pronto) return; const {data:ac,error}=await sb.rpc('meu_acesso');
    if(error||!ac){ $('login').hidden=false; setModo('entrar'); msg('O e-mail '+session.user.email+' ainda não foi liberado. Peça ao MASTER para incluir você.',true); await sb.auth.signOut(); return; }
    pronto=true; $('login').hidden=true; window.__rbac.aplicar(ac); rodape(ac); resolve(criarDb());
  }
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){ $('login').hidden=false; setModo('nova'); return; }
    if(session&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')) setTimeout(()=>entrar(session),0);
    if(ev==='INITIAL_SESSION'&&!session){ $('login').hidden=false; setModo('entrar'); }
  });
});
})();
</script>
<script src="/extras.js"></script>

<script>
(function(){
const S = { agregados:[], locacoes:[], feriados:[], fech:[], config:{feriadoRegra:'sabdom'}, loaded:{a:false,l:false,f:false,q:false,c:false}, custos:[], faltas:new Map(), nfs:[], adiant:[] };
const UI = { cLoc:'', cTipo:'', cf:{data:'',loc:'',tipo:'Agregado esporádico',qtd:'1',vu:'',desc:'',sub:''}, colar:'', pMes:'', gMes:'', lMes:'', pN:6, pLoc:'', hBusca:'', hLoc:'', hQ:'', sort:{k:'pag',dir:-1}, det:{}, ultimo:'', tab:'fechamento', q: currentQuinzena(), de:'', ate:'', pag:'', modo:'individual', sel:[], aj:{}, busca:'', expand:{}, delAsk:'', saving:false, fAno:String(new Date().getFullYear()), mostrarInativos:false };
let db = null;
const writeChains = {};

/* ---------- utilidades ---------- */
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt = v => BRL.format(Number(v)||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if(v===''||v==null) return 0; if(typeof v==='number') return isFinite(v)?v:0; let t=String(v).trim().replace(/[R$\s]/g,''); if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.'); const n=Number(t); return isFinite(n)?n:0; };
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function parse(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function br(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function currentQuinzena(){ const t=new Date(); return {y:t.getFullYear(), m:t.getMonth()+1, h:t.getDate()<=15?1:2}; }
function qBounds(q){ const start = new Date(Date.UTC(q.y,q.m-1,q.h===1?1:16)); const last = new Date(Date.UTC(q.y,q.m,0)).getUTCDate(); const end = new Date(Date.UTC(q.y,q.m-1,q.h===1?15:last)); return {start,end}; }
function qId(q){ return q.y+'-'+pad(q.m)+'-Q'+q.h; }
function qShift(q,dir){ let {y,m,h}=q; if(dir>0){ if(h===1)h=2; else {h=1;m++; if(m>12){m=1;y++;}} } else { if(h===2)h=1; else {h=2;m--; if(m<1){m=12;y--;}} } return {y,m,h}; }
function qLabel(q){ return (q.h===1?'1ª':'2ª')+' quinzena de '+MESES[q.m-1]+' '+q.y; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function locNome(n){ return n||'—'; }
function ccDe(loc,h){ const l=S.locacoes.find(x=>x.nome===loc); return l? (h===1?l.codigoQ1:l.codigoQ2)||'' : ''; }
function ccAmbos(loc){ const a=ccDe(loc,1), b=ccDe(loc,2); return a||b ? (a||'—')+' / '+(b||'—') : ''; }
function feriadoVale(f,loc){ if((f.tipo||'Nacional')==='Nacional') return true; const ls=f.locacoes||[]; return ls.length===0 || ls.includes(loc); }

/* ---------- persistência ---------- */
function chain(path, fn){ const p=(writeChains[path]||Promise.resolve()).then(fn).catch(e=>{ console.error(e); toast(e&&e.code==='quota_exceeded'?'Limite de armazenamento atingido':'Não foi possível salvar. Tente de novo.'); }); writeChains[path]=p; return p; }
function saveDoc(col,id,data){
  const list = col==='agregados'?S.agregados:col==='locacoes'?S.locacoes:S.feriados;
  const i=list.findIndex(x=>x.id===id); const rec={...data,id}; if(i>=0) list[i]=rec; else list.push(rec);
  render();
  if(db){ const body={...data}; delete body.id; return chain(col+'/'+id,()=>db.doc(col+'/'+id).set(body)); }
}
function delDoc(col,id){
  const key = col==='agregados'?'agregados':col==='locacoes'?'locacoes':'feriados';
  S[key]=S[key].filter(x=>x.id!==id); render();
  if(db) return chain(col+'/'+id,()=>db.doc(col+'/'+id).delete());
}
function saveConfig(cfg){ S.config={...S.config,...cfg}; render(); if(db) chain('config/geral',()=>db.doc('config/geral').set(S.config)); }

/* ---------- cálculo ---------- */
function feriadoMap(loc, start, end){
  const m=new Map();
  for(const f of S.feriados){ if(!f.data) continue; if(!feriadoVale(f,loc)) continue; const d=parse(f.data); if(d<start||d>end) continue; m.set(f.data,f.descricao||'Feriado'); }
  return m;
}
function periodo(){ const b=qBounds(UI.q); return {start:UI.de?parse(UI.de):b.start, end:UI.ate?parse(UI.ate):b.end}; }
function fechadosNaQ(qid){ const set=new Map(); S.fech.filter(f=>f.qid===qid).forEach(f=>(f.itens||[]).forEach(i=>set.set(i.agregadoId,f))); return set; }
function noPeriodo(a,start,end){ const ini=parse(a.inicio), fim=parse(a.fim); if(!ini) return false; if(a.ativo===false) return false; return ini<=end && (!fim||fim>=start); }
function elegiveis(){ const {start,end}=periodo(); const fx=fechadosNaQ(qId(UI.q)); return S.agregados.filter(a=>noPeriodo(a,start,end)&&!fx.has(a.id)).sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR')); }
const SIT={T:'Trabalhado',D:'Dispensado',N:'Não trabalhado'};
function calcAg(a,start,end,h,aj,semFaltas){
  aj=aj||{}; const ov=aj.dias||{}; const locObj=S.locacoes.find(l=>l.nome===a.locacao); const segLoc=locObj?num(locObj.diariaSegunda):0;
  const ini=parse(a.inicio), fim=parse(a.fim);
  const s=ini>start?ini:start; const e=fim&&fim<end?fim:end;
  const dias=[];
  if(s<=e){ const fer=feriadoMap(a.locacao,s,e);
    for(let d=new Date(s); d<=e; d.setUTCDate(d.getUTCDate()+1)){
      const k=iso(d), w=d.getUTCDay(), fds=(w===0||w===6);
      let base='T';
      if(fer.has(k)) base='N';
      else if(w===0) base='D';
      else if(w===6 && a.trabalhaSabado!=='S') base='D';
      // faltas lançadas na aba Frequência entram como padrão do dia (o operador ainda pode mudar clicando no dia)
      const fx=(!semFaltas&&base==='T')?S.faltas.get(k+'_'+a.id):null; const falta=(fx&&fx.periodo)||'';
      if(falta==='I') base='N';
      const sit=ov[k]||base; const taxa=fds?num(a.diariaFds):(w===1&&segLoc>0?segLoc:num(a.diariaUtil));
      let vo=(aj.valores||{})[k]; if(falta==='M'&&sit==='T'&&(vo==null||String(vo).trim()==='')) vo=String(Math.round(taxa*50)/100);
      const editado=sit==='T'&&vo!=null&&String(vo).trim()!==''&&num(vo)!==taxa;
      dias.push({data:k,w,sit,taxa,valor:sit==='T'?(editado?num(vo):taxa):0,editado,feriado:fer.get(k)||'',falta:falta&&!ov[k]?falta:''});
    } }
  const lim=l=>(l||[]).filter(x=>(x.d||'').trim()||num(x.v)).map(x=>({desc:(x.d||'').trim(),valor:Math.abs(num(x.v)),...(x.ad?{ad:x.ad}:{})}));
  const descontos=lim(aj.desc), acrescimos=lim(aj.acr);
  const subtotal=dias.reduce((t,x)=>t+x.valor,0), totDesc=descontos.reduce((t,x)=>t+x.valor,0), totAcr=acrescimos.reduce((t,x)=>t+x.valor,0);
  const c=k=>dias.filter(x=>x.sit===k).length;
  return {agregadoId:a.id,nome:a.nome,empresa:a.empresa||'',locacao:a.locacao||'',cc:ccDe(a.locacao,h),codigos:ccAmbos(a.locacao),veiculo:a.veiculo||'',contrato:!!a.contrato,
    de:s<=e?iso(s):'',ate:s<=e?iso(e):'',diariaUtil:num(a.diariaUtil),diariaFds:num(a.diariaFds),dias,nT:c('T'),nD:c('D'),nN:c('N'),
    subtotal,descontos,acrescimos,totDesc,totAcr,total:subtotal+totAcr-totDesc};
}
// NFS importadas na aba Notas fiscais para o agregado na quinzena
function nfsDoAg(agId,q){ const m=q.y+'-'+pad(q.m); return S.nfs.filter(n=>n.agregadoId===agId&&n.refMes===m&&String(n.quinzena)===String(q.h)); }
function nfsHtml(r){ const L=nfsDoAg(r.agregadoId,UI.q); if(!L.length) return '<span class="pill bad">Sem NFS</span>';
  const v=Math.round(L.reduce((t,n)=>t+num(n.valor),0)*100)/100, d=Math.round((v-r.total)*100)/100;
  return `<div style="font-weight:600">${fmt(v)}</div><div class="dim">NFS nº ${esc(L.map(n=>n.numero).join(', '))}</div>`+(Math.abs(d)<0.01?'<span class="pill ok">Confere</span>':`<span class="pill warn" title="Valor da NFS menos o total apurado">${d>0?'NFS maior':'NFS menor'} ${fmt(Math.abs(d))}</span>`); }
window.__app = {S, calcAg, noPeriodo, render:()=>{ const ae=document.activeElement; if(UI.tab==='fechamento'&&!(ae&&ae.dataset&&(ae.dataset.line||ae.dataset.dv))) render(); }};
// parcelas de adiantamento ainda não descontadas até a quinzena (inclui atrasadas)
function adiantPendentes(agId,qid){ const baixa=new Set(); S.fech.forEach(f=>(f.itens||[]).forEach(it=>(it.descontos||[]).forEach(x=>{ if(x&&x.ad) baixa.add(x.ad); })));
  const out=[]; S.adiant.filter(a=>a.agregadoId===agId).forEach(a=>{ const n=(a.parcelas||[]).length; (a.parcelas||[]).forEach((p,i)=>{ const k=a.id+'#'+i; if(baixa.has(k)||!p.qid||p.qid>qid) return;
    out.push({k,valor:num(p.valor),desc:'Adiantamento de '+br(a.data)+(n>1?' (parcela '+(i+1)+'/'+n+')':'')+(p.qid<qid?' · previsto p/ '+qLabel(qFromId(p.qid)):'')}); }); }); return out; }
function injetaAdiant(agId){ const aj=UI.aj[agId]=UI.aj[agId]||{}; const q=qId(UI.q); if(aj.adQ===q) return; aj.adQ=q; aj.desc=(aj.desc||[]).filter(x=>!x.ad);
  adiantPendentes(agId,q).forEach(p=>aj.desc.push({d:p.desc,v:p.valor.toLocaleString('pt-BR',{minimumFractionDigits:2}),ad:p.k})); }
function selecionados(){ const {start,end}=periodo(); return UI.sel.map(id=>S.agregados.find(a=>a.id===id)).filter(Boolean).map(a=>{ injetaAdiant(a.id); return calcAg(a,start,end,UI.q.h,UI.aj[a.id]); }); }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===UI.tab)));
  const v=document.getElementById('view');
  const focusId=document.activeElement&&document.activeElement.id; const sel=focusId&&document.activeElement.selectionStart;
  if(UI.tab==='fechamento') v.innerHTML=viewNovo();
  else if(UI.tab==='historico') v.innerHTML=viewHistorico();
  else if(UI.tab==='painel') v.innerHTML=viewPainelRB();
  else if(UI.tab==='custos') v.innerHTML=viewCustos();
  else if(UI.tab==='agregados') v.innerHTML=viewAgregados();
  else if(UI.tab==='locacoes') v.innerHTML=viewLocacoes();
  else if(UI.tab==='frequencia'||UI.tab==='nfs'||UI.tab==='adiant'){ if(window.__ext) window.__ext.mostrar(UI.tab,v); else v.innerHTML='<div class="empty">Módulo não carregou. Recarregue a página.</div>'; }
  else if(UI.tab==='usuarios'){ if(!v.querySelector('#rbacRoot')){ v.innerHTML=''; window.__rbac.montarUsuarios(v); } } else if(UI.tab==='semacesso') v.innerHTML='<div class="empty" style="padding:40px">Nenhum módulo liberado para o seu perfil. Fale com o MASTER.</div>'; else v.innerHTML=viewFeriados();
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
}

function empresas(){ return [...new Set(S.agregados.map(a=>a.empresa).filter(Boolean))].sort(); }

function monthNav(){
  return `<div class="row">
    <div class="month"><button class="round" data-act="mprev" aria-label="Mês anterior">‹</button><b>${MESES[UI.q.m-1][0].toUpperCase()+MESES[UI.q.m-1].slice(1)} ${UI.q.y}</b><button class="round" data-act="mnext" aria-label="Próximo mês">›</button></div>
    <div class="seg"><button data-act="q1" aria-pressed="${UI.q.h===1}">1ª quinzena</button><button data-act="q2" aria-pressed="${UI.q.h===2}">2ª quinzena</button></div></div>`;
}
function viewNovo(){
  const b=qBounds(UI.q); const {start,end}=periodo();
  const lista=elegiveis(); const fx=fechadosNaQ(qId(UI.q));
  const nFechados=S.agregados.filter(a=>noPeriodo(a,start,end)&&fx.has(a.id)).length;
  const filtro=UI.busca.toLowerCase();
  const comNfs=lista.filter(a=>nfsDoAg(a.id,UI.q).length).length;
  const vis=lista.filter(a=>(!filtro||(a.nome+' '+ccDe(a.locacao,UI.q.h)+' '+(a.locacao||'')).toLowerCase().includes(filtro))&&(!UI.soNfs||nfsDoAg(a.id,UI.q).length));
  const rows=selecionados(); const tot=rows.reduce((s,r)=>s+r.total,0);
  const lote=UI.modo==='lote';
  const semNfs=rows.filter(r=>!nfsDoAg(r.agregadoId,UI.q).length);
  const pronto=rows.length>0 && UI.pag && !UI.saving;
  const loading=db&&(!S.loaded.a||!S.loaded.q);
  const ult=UI.ultimo&&S.fech.find(f=>f.id===UI.ultimo);
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="row" style="justify-content:space-between"><span style="color:var(--muted)">${lote?'Selecione os agregados que já emitiram a NFS do período.':'Selecione o agregado que emitiu a NFS do período.'}</span>
    <div class="seg"><button data-act="modoInd" aria-pressed="${!lote}">Individual</button><button data-act="modoLote" aria-pressed="${lote}">Lote</button></div></div>
  <div class="layout">
   <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="panel step"><h2>1 · Período</h2>
      ${monthNav()}
      <div class="row"><span style="color:var(--muted)">De</span><input type="date" id="pDe" value="${UI.de||iso(b.start)}" style="width:auto"><span style="color:var(--muted)">até</span><input type="date" id="pAte" value="${UI.ate||iso(b.end)}" style="width:auto"></div>
      <label class="lbl" style="max-width:290px">Data de pagamento ao agregado *<input type="date" id="pPag" value="${UI.pag}"></label>
    </section>
    <section class="panel step"><div class="row" style="justify-content:space-between"><h2>2 · Selecione ${lote?'os agregados':'o agregado'}</h2>

function qFromId(q){ const [y,m,h]=q.split(/-Q?/).map(Number); return {y,m,h}; }
function qCurto(q){ return (q.h===1?'1ª':'2ª')+' '+MESES[q.m-1].slice(0,3)+'/'+String(q.y).slice(2); }
function niceScale(v){ if(v<=0) return {max:1,ticks:[0,1]}; const raw=v/5; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; const k=Math.ceil(v/step); const max=step*k; return {max,ticks:Array.from({length:k+1},(_,i)=>i*step)}; }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function kfmt(v){ return v>=1e6?(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':v>=1e3?(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil':String(Math.round(v)); }
function barsV(data,valFmt,tipFn){
  const W=720,H=260,pl=56,pr=8,pt=18,pb=34; const iw=W-pl-pr, ih=H-pt-pb;
  const {max,ticks}=niceScale(Math.max(0,...data.map(d=>d.v)));
  const bw=iw/data.length; const w=Math.max(4,Math.min(36,bw*0.62));
  const every=Math.ceil(data.length/12);
  const peak=data.reduce((m,d,i)=>d.v>data[m].v?i:m,0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${ticks.map(t=>{const y=pt+ih-ih*t/max;return `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-8}" y="${y+4}" text-anchor="end">${valFmt(t)}</text>`;}).join('')}
  ${data.map((d,i)=>{const x=pl+bw*i+(bw-w)/2; const h=ih*d.v/max; const y=pt+ih-h; const r=Math.min(4,w/2,h);
    const path=h>0?`M${x},${pt+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${pt+ih} Z`:'';
    return `<g data-tip="${esc(tipFn(d))}"><rect class="hit" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}"/>${path?`<path class="bar" d="${path}"/>`:''}
    ${i%every===0||i===data.length-1?`<text class="axis" x="${x+w/2}" y="${H-12}" text-anchor="middle">${esc(d.k)}</text>`:''}
    ${i===peak&&d.v>0?`<text class="lbl2" x="${x+w/2}" y="${y-6}" text-anchor="middle">${valFmt(d.v)}</text>`:''}</g>`;}).join('')}</svg>`;
}
function barsH(data){
  if(!data.length) return '<div class="empty">Sem dados no período.</div>';
  const max=Math.max(...data.map(d=>d.v),1);
  return `<div class="breakdown">${data.map(d=>`<div class="brow" data-tip="${esc('<b>'+esc(d.k)+'</b><br>'+fmt(d.v)+' · '+d.n+' lançamento'+(d.n===1?'':'s'))}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.k)}</span><div class="track"><div class="fill" style="width:${(d.v/max*100).toFixed(1)}%"></div></div><span class="val">${fmt(d.v)}</span></div>`).join('')}</div>`;
}
function barsStack(data,valFmt,tipFn){
  const W=720,H=260,pl=56,pr=8,pt=18,pb=34; const iw=W-pl-pr, ih=H-pt-pb;
  const temC=data.some(d=>d.c);
  const lf=v=>v>=1e6?(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi':v>=1e3?(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
  const {max,ticks}=niceScale(Math.max(0,...data.map(d=>Math.max(d.a+d.b,d.c||0))));

function parseColar(txt){
  const nomes=new Map(S.locacoes.map(l=>[l.nome.toUpperCase(),l.nome]));
  return String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(l.includes('\t')?'\t':';').map(x=>x.trim())).filter(c=>!/^data$/i.test(c[0]||'')).map(c=>{
    const data=parseDataBr(c[0]); const ln=(c[1]||'').toUpperCase(); const locOk=nomes.has(ln);
    const qtd=c[3]?num(c[3]):1; const vu=num(c[4]);
    return {data,locacao:locOk?nomes.get(ln):c[1]||'',locOk,tipo:c[2]||'Outros',qtd:qtd||1,vu,desc:c[5]||'',ok:!!data&&locOk&&vu>0};
  });
}
async function salvarCustos(itens){
  const now=new Date().toISOString();
  const docs=itens.map(it=>({id:uid(),data:it.data,qid:qidDe(it.data),locacao:it.locacao,tipo:it.tipo||'Outros',qtd:it.qtd,valorUnit:it.vu,valor:Math.round(it.qtd*it.vu*100)/100,descricao:it.desc||'',substituido:it.sub||'',substituidoNome:it.subNome||'',criadoEm:now}));
  S.custos=S.custos.concat(docs); render();
  if(db){ for(const d of docs){ const body={...d}; delete body.id; await chain('custos/'+d.id,()=>db.doc('custos/'+d.id).set(body)); } }
  return docs.length;
}

let ED=null;
function edCalc(it){
  it.dias.forEach(d=>{ d.taxa=num(d.taxa)|| (d.w===0||d.w===6?num(it.diariaFds):num(it.diariaUtil)); if(d.sit!=='T') d.valor=0; d.editado=d.sit==='T'&&Math.abs(num(d.valor)-d.taxa)>0.005; });
  const lim=l=>(l||[]).filter(x=>(x.desc||'').trim()||num(x.valor)).map(x=>({desc:(x.desc||'').trim(),valor:Math.abs(num(x.valor)),...(x.ad?{ad:x.ad}:{})}));
  it.subtotal=Math.round(it.dias.reduce((t,d)=>t+num(d.valor),0)*100)/100;
  it.totDesc=Math.round(lim(it.descontos).reduce((t,x)=>t+x.valor,0)*100)/100;
  it.totAcr=Math.round(lim(it.acrescimos).reduce((t,x)=>t+x.valor,0)*100)/100;
  it.total=Math.round((it.subtotal+it.totAcr-it.totDesc)*100)/100;
  ['T','D','N'].forEach(k=>it['n'+k]=it.dias.filter(d=>d.sit===k).length);
  return it;
}
function edTotHtml(){ const it=ED.it; return `<div class="sumlist" style="max-height:none"><div><span>Subtotal diárias</span><span>${fmt(it.subtotal)}</span></div><div><span>Acréscimos</span><span>+ ${fmt(it.totAcr)}</span></div><div><span>Descontos</span><span>− ${fmt(it.totDesc)}</span></div><div style="font-weight:700;font-size:14px;color:var(--title)"><span>Total a pagar</span><span style="color:var(--magenta)">${fmt(it.total)}</span></div><div style="color:var(--muted)"><span>Trab. / Disp. / Não trab.</span><span>${it.nT} / ${it.nD} / ${it.nN}</span></div></div>`; }

function salvarEdFech(){
  const f=S.fech.find(x=>x.id===ED.fid); if(!f){ closeModal(); return; }
  const pag=val('ed_pag'); if(!pag) return err('Informe a data de pagamento.');
  const it=edCalc(ED.it); it.descontos=(it.descontos||[]).filter(x=>(x.desc||'').trim()||num(x.valor)).map(x=>({desc:(x.desc||'').trim(),valor:Math.abs(num(x.valor))})); it.acrescimos=(it.acrescimos||[]).filter(x=>(x.desc||'').trim()||num(x.valor)).map(x=>({desc:(x.desc||'').trim(),valor:Math.abs(num(x.valor))}));
  const itens=(f.itens||[]).map(i=>i.agregadoId===ED.ag?it:i);
  const nf={...f,itens,dataPagamento:pag,total:Math.round(itens.reduce((t,i)=>t+num(i.total),0)*100)/100,alteradoEm:new Date().toISOString()};
  S.fech=S.fech.map(x=>x.id===f.id?nf:x); const body=JSON.parse(JSON.stringify(nf)); delete body.id;
  if(db) chain('fech/'+f.id,()=>db.doc('fech/'+f.id).set(body));
  ED=null; closeModal(); render(); toast('Lançamento regravado no fechamento Nº '+nf.numero);

  const n2=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const L=[]; S.fech.forEach(f=>(f.itens||[]).forEach(r=>{ if(r.agregadoId===id) L.push({f,r}); }));

function submitModal(){
  if(val('m_kind')==='edfech') return salvarEdFech();
  const kind=val('m_kind'); const id=val('m_id')||uid();
  if(kind==='ag'){
    if(!val('m_nome')) return err('Informe o nome do agregado.');
    if(!val('m_inicio')) return err('Informe a data de início.');
    if(val('m_fim') && val('m_fim')<val('m_inicio')) return err('A data fim não pode ser anterior à data de início.');
    saveDoc('agregados',id,{nome:val('m_nome'),empresa:val('m_empresa').toUpperCase(),locacao:val('m_locacao'),inicio:val('m_inicio'),fim:val('m_fim'),
      diariaUtil:num(val('m_du')),diariaFds:num(val('m_fds')),trabalhaSabado:val('m_sab')||'N',veiculo:val('m_veiculo'),contrato:chk('m_contrato'),ativo:chk('m_ativo')});
    toast('Agregado salvo');
  } else if(kind==='custo'){
    const c=S.custos.find(x=>x.id===id); if(!c){ closeModal(); return; }
    const data=val('mc_data'), loc=val('mc_loc'), vu=num(val('mc_vu')), qtd=num(val('mc_qtd'))||1;
    if(!data) return err('Informe a data.'); if(!loc) return err('Selecione a locação.'); if(!(vu>0)) return err('Informe o valor unitário.');
    const sub=S.agregados.find(a=>a.id===val('mc_sub'));
    const novo={...c,data,qid:qidDe(data),locacao:loc,tipo:val('mc_tipo')||'Outros',qtd,valorUnit:vu,valor:Math.round(qtd*vu*100)/100,descricao:val('mc_desc'),substituido:sub?sub.id:'',substituidoNome:sub?sub.nome:'',alteradoEm:new Date().toISOString()};
    S.custos=S.custos.map(x=>x.id===id?novo:x);
    if(novo.qid!==c.qid){ const [y,m,d]=data.split('-').map(Number); UI.q={y,m,h:d<=15?1:2}; }
    render(); const body={...novo}; delete body.id; if(db) chain('custos/'+id,()=>db.doc('custos/'+id).set(body));
    toast('Lançamento atualizado'+(novo.qid!==c.qid?' · movido para a '+qLabel(UI.q):''));
  } else if(kind==='loc'){
    const nome=val('m_nome').toUpperCase();
    if(!nome) return err('Informe o nome da locação.');
    if(S.locacoes.some(l=>l.nome===nome&&l.id!==id)) return err('Já existe uma locação com esse nome.');
    const antigo=(S.locacoes.find(l=>l.id===id)||{}).nome;
    saveDoc('locacoes',id,{nome,grupo:val('m_grupo').toUpperCase(),cidade:val('m_cidade').toUpperCase(),uf:val('m_uf').toUpperCase(),valorContrato:num(val('m_contr')),qtdAgregados:Math.max(0,Math.round(num(val('m_qtd')))),diariaSegunda:num(val('m_seg')),codigoQ1:val('m_cc1').toUpperCase(),codigoQ2:val('m_cc2').toUpperCase()});
    if(antigo&&antigo!==nome){
      S.agregados.filter(a=>a.locacao===antigo).forEach(a=>saveDoc('agregados',a.id,{...a,locacao:nome}));
      S.feriados.filter(f=>(f.locacoes||[]).includes(antigo)).forEach(f=>saveDoc('feriados',f.id,{...f,locacoes:f.locacoes.map(x=>x===antigo?nome:x)}));
    }
    toast('Locação salva');
  } else {
    if(!val('m_data')) return err('Informe a data do feriado.');
    if(!val('m_desc')) return err('Informe a descrição.');
    const tipo=val('m_tipo'); const ls=tipo==='Nacional'?[]:[...document.querySelectorAll('[data-locname]')].filter(x=>x.checked).map(x=>x.dataset.locname);
    if(tipo!=='Nacional'&&!ls.length) return err('Marque ao menos uma locação para feriado '+tipo.toLowerCase()+'.');
    saveDoc('feriados',id,{data:val('m_data'),descricao:val('m_desc'),tipo,locacoes:ls});
    UI.fAno=val('m_data').slice(0,4); toast('Feriado salvo');
  }
  closeModal();
}

function backupObj(){ const strip=a=>a.map(x=>{ const {id,...d}=x; return {id,data:d}; });
  return {app:'pagamento-agregados',versao:1,exportadoEm:new Date().toISOString(),agregados:strip(S.agregados),locacoes:strip(S.locacoes),feriados:strip(S.feriados),fech:strip(S.fech),custos:strip(S.custos),config:[{id:'geral',data:S.config}]}; }
function exportarBackup(){ const o=backupObj(); const n=['agregados','locacoes','feriados','fech','custos'].map(k=>o[k].length);
  salvarArquivo('backup_agregados_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(o)],{type:'application/json'}));
  toast('Backup: '+n[0]+' agregados, '+n[1]+' locações, '+n[2]+' feriados, '+n[3]+' fechamentos, '+n[4]+' custos'); }
async function importarBackup(file){
  let o; try{ o=JSON.parse(await file.text()); }catch(e){ toast('Arquivo inválido'); return; }
  if(!o||o.app!=='pagamento-agregados'){ toast('Este arquivo não é um backup do Pagamento de Agregados'); return; }
  if(!db||!db.importar){ toast('Importação indisponível aqui'); return; }
  let tot=0; for(const k of ['locacoes','agregados','feriados','fech','custos','config']){ const L=o[k]||[]; await db.importar(k,L); tot+=L.length; }
  toast(tot+' registros importados');
}
async function salvarArquivo(name,blob){
  try{ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
  catch(e){ if(e&&e.code!=='cancelled'&&e.code!=='declined') toast('Download não concluído'); }
}
function exportCsv(fechs,name){
  const n=v=>(Number(v)||0).toFixed(2).replace('.',',');
  const head=['Nº','Tipo','Agregado','Empresa','Locação','Centro de custo','Início','Fim','Data pagamento','Trabalhados','Dispensados','Não trabalhados','Diárias','Acréscimos','Descontos','Total'];
  const lines=[head]; fechs.forEach(f=>(f.itens||[]).forEach(r=>lines.push([f.numero,f.tipo==='lote'?'Lote':'Individual',r.nome,r.empresa,r.locacao,r.cc,br(r.de),br(r.ate),br(f.dataPagamento),r.nT,r.nD,r.nN,n(r.subtotal),n(r.totAcr),n(r.totDesc),n(r.total)])));
  const csv='﻿'+lines.map(l=>l.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');
  salvarArquivo(name,new Blob([csv],{type:'text/csv;charset=utf-8'}));
}
function pdfResumo(f){
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J){ toast('Gerador de PDF não carregou. Recarregue a página.'); return; }
  const doc=new J({unit:'pt',format:'a4',orientation:'landscape'}); const W=842, L=40, R=W-40, IL=L+15, IR=R-15;
  const its=[...(f.itens||[])].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const m=v=>BRL.format(Number(v)||0).replace(/ /g,' ');
  const gray=()=>doc.setTextColor(110,120,140), ink=()=>doc.setTextColor(20,32,58), green=()=>doc.setTextColor(31,128,84), blue=()=>doc.setTextColor(30,70,170);
  const hr=(y,x1,x2,c,w)=>{ doc.setDrawColor(...(c||[215,221,230])); doc.setLineWidth(w||.6); doc.line(x1,y,x2,y); };
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); gray(); doc.text('VELOX  ·  AGREGADOS QUINZENAL',L,45,{charSpace:.8});
  doc.setFont('times','bold'); doc.setFontSize(20); ink(); doc.text('Resumo do lote Nº '+f.numero,L,72);
  doc.setFont('courier','normal'); doc.setFontSize(10); gray(); doc.text('Período '+br(f.de)+' – '+br(f.ate)+'  ·  '+its.length+' agregado'+(its.length===1?'':'s')+'  ·  Pagamento '+br(f.dataPagamento),L,90);
  hr(106,L,R);
  const X={cc:IL+262,trab:IL+375,disp:IL+415,nt:IL+475,acr:IL+565,desc:IL+650,tot:IR};
  let y=150;
  const head=()=>{ doc.setFont('helvetica','normal'); doc.setFontSize(7); gray();
    doc.text('NOME',IL,y); doc.text('CÓD. QUINZENA',X.cc,y); [['TRAB.',X.trab],['DISP.',X.disp],['NÃO TRAB.',X.nt],['ACRÉSCIMOS (R$)',X.acr],['DESCONTOS (R$)',X.desc],['TOTAL (R$)',X.tot]].forEach(([t,x])=>doc.text(t,x,y,{align:'right'}));
    y+=8; hr(y,IL,IR); y+=17; };
  head();
  its.forEach(r=>{

async function gravar(){
  const rows=selecionados(); if(!rows.length||!UI.pag) return;
  const semNfs=rows.filter(r=>!nfsDoAg(r.agregadoId,UI.q).length);
  if(semNfs.length && !confirm(`${semNfs.length===1?'Este agregado não tem':'Estes agregados não têm'} NFS importada na ${qLabel(UI.q)}:\n\n${semNfs.map(r=>'• '+r.nome).join('\n')}\n\nDeseja gravar o fechamento mesmo assim?`)) return;
  rows.forEach(r=>{ r.nfs=nfsDoAg(r.agregadoId,UI.q).map(n=>({id:n.id,numero:n.numero,valor:num(n.valor),emissao:n.emissao||''})); r.semNfs=!r.nfs.length; });
  const {start,end}=periodo(); const qid=qId(UI.q);
  const fx=fechadosNaQ(qid); if(rows.some(r=>fx.has(r.agregadoId))){ toast('Algum agregado já foi fechado nesta quinzena'); UI.sel=UI.sel.filter(id=>!fx.has(id)); render(); return; }
  const id=uid();
  const numero=proxNumero(); const doc={numero,qid,ano:UI.q.y,mes:UI.q.m,quinzena:UI.q.h,de:iso(start),ate:iso(end),dataPagamento:UI.pag,tipo:UI.modo,criadoEm:new Date().toISOString(),itens:rows,total:rows.reduce((s,r)=>s+r.total,0)};
  UI.saving=true; S.fech.push({...doc,id}); render();
  try{ if(db) await db.doc('fech/'+id).set(JSON.parse(JSON.stringify(doc))); toast('Fechamento Nº '+numero+' gravado'); UI.sel=[]; UI.aj={}; UI.det={}; UI.ultimo=id; }
  catch(e){ console.error(e); S.fech=S.fech.filter(f=>f.id!==id); toast('Não foi possível gravar. Tente de novo.'); }
  UI.saving=false; render();
}

  else if(a==='delYes'){ const k=val('m_kind'),id=val('m_id'); delDoc(k==='ag'?'agregados':k==='loc'?'locacoes':'feriados',id); closeModal(); toast('Excluído'); }

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); if(UI.colar){UI.colar='';render();} } if(e.key==='Enter'){ const r=e.target.closest&&e.target.closest('tr.click'); if(r) r.click(); } });
document.addEventListener('submit',e=>{ if(e.target.id==='dlg'){ e.preventDefault(); submitModal(); return; }
  if(e.target.id==='cform'){ e.preventDefault(); const F=UI.cf; F.data=val('cf_data');
    const erro=!F.data?'Informe a data.':!F.loc?'Selecione a locação.':!(num(F.vu)>0)?'Informe o valor unitário.':'';
    if(erro){ toast(erro); return; }
    const sub=S.agregados.find(a=>a.id===F.sub);
    salvarCustos([{data:F.data,locacao:F.loc,tipo:F.tipo.trim()||'Outros',qtd:num(F.qtd)||1,vu:num(F.vu),desc:F.desc.trim(),sub:F.sub,subNome:sub?sub.nome:''}]).then(()=>toast('Custo lançado'));
    const [y,m,d]=F.data.split('-').map(Number); UI.q={y,m,h:d<=15?1:2};
    UI.cf={...F,vu:F.vu,desc:'',sub:''}; render(); const el=document.getElementById('cf_desc'); if(el) el.focus(); } });
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='busca'){ UI.busca=el.value; render(); return; }
  if(ED&&el.dataset&&(el.dataset.edv||el.dataset.edl)){
    if(el.dataset.edv){ const d=ED.it.dias.find(x=>x.data===el.dataset.edv); d.valor=el.value.trim()===''?d.taxa:num(el.value); }
    else { const [k,i,fld]=el.dataset.edl.split('|'); ED.it[k][Number(i)][fld]=fld==='valor'?num(el.value):el.value; }
    edCalc(ED.it); const t=document.getElementById('ed_tot'); if(t) t.innerHTML=edTotHtml(); return; }
  if(el.id==='ed_pag'&&ED){ ED.pag=el.value; return; }
  if(el.id==='mc_qtd'||el.id==='mc_vu'){ const t=document.getElementById('mc_tot'); if(t) t.textContent=fmt((num(val('mc_qtd'))||1)*num(val('mc_vu'))); return; }
  if(el.id==='colarTxt'){ UI.colar=el.value||' '; clearTimeout(render._t); render._t=setTimeout(render,400); return; }
  if(el.id&&el.id.startsWith('cf_')&&el.id!=='cf_loc'&&el.id!=='cf_sub'){ const k=el.id.slice(3); UI.cf[k==='data'?'data':k]=el.value; if(k==='qtd'||k==='vu'){ clearTimeout(render._t); render._t=setTimeout(render,400);} return; }
  if(el.id==='hBusca'){ UI.hBusca=el.value; render(); return; }
  if(el.dataset&&el.dataset.dv){ const [id,k]=el.dataset.dv.split('|'); const aj=UI.aj[id]=UI.aj[id]||{}; aj.valores=aj.valores||{}; if(el.value.trim()==='') delete aj.valores[k]; else aj.valores[k]=el.value; clearTimeout(render._t); render._t=setTimeout(render,500); return; }
  if(el.dataset&&el.dataset.line){
    const [id,k,i,f]=el.dataset.line.split('|'); UI.aj[id][k][Number(i)][f]=el.value;
    clearTimeout(render._t); render._t=setTimeout(render,500);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pDe'){UI.de=el.value;render();}
  else if(el.id==='pAte'){UI.ate=el.value;render();}
  else if(el.id==='pPag'){UI.pag=el.value;render();}
  else if(el.id==='mc_loc'){ const sel=document.getElementById('mc_sub'); if(sel){ const cur=sel.value; sel.innerHTML='<option value="">—</option>'+S.agregados.filter(a=>a.locacao===el.value).sort((a,z)=>a.nome.localeCompare(z.nome,'pt-BR')).map(a=>`<option value="${a.id}" ${a.id===cur?'selected':''}>${esc(a.nome)}</option>`).join(''); } }
  else if(el.id==='cf_loc'){UI.cf.loc=el.value;UI.cf.sub='';render();}
  else if(el.id==='cf_sub'){UI.cf.sub=el.value;}
  else if(el.id==='cLoc'){UI.cLoc=el.value;render();}
  else if(el.id==='cTipo'){UI.cTipo=el.value;render();}
  else if(el.id==='fileImp'){ const f=el.files&&el.files[0]; el.value=''; if(f) importarBackup(f); }
  else if(el.id==='lMes'){UI.lMes=el.value;render();}
  else if(el.id==='gMes'){UI.gMes=el.value;render();}
  else if(el.id==='pMes'){UI.pMes=el.value;render();}
  else if(el.id==='pLoc'){UI.pLoc=el.value;render();}
  else if(el.id==='hLoc'){UI.hLoc=el.value;render();}
  else if(el.id==='hQ'){UI.hQ=el.value;UI.delAsk='';render();}
  else if(el.id==='fAno'){UI.fAno=el.value;render();}
  else if(el.id==='mostrarInativos'){UI.mostrarInativos=el.checked;render();}
  else if(el.id==='m_locacao'){ const i=document.getElementById('m_ccinfo'); if(i) i.innerHTML=esc(ccAmbos(el.value))||'<span style="color:var(--muted)">Locação sem centro de custo cadastrado</span>'; }
  else if(el.id==='m_tipo'){ document.getElementById('m_locbox').hidden=el.value==='Nacional'; }
});

document.addEventListener('mousemove',e=>{ const t=document.getElementById('ctip'); const g=e.target.closest&&e.target.closest('[data-tip]'); if(!g){ t.hidden=true; return; } t.innerHTML=g.dataset.tip; t.hidden=false; const w=t.offsetWidth, h=t.offsetHeight; let x=e.clientX+14, y=e.clientY-h-10; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y<8) y=e.clientY+16; t.style.left=x+'px'; t.style.top=y+'px'; });
/* ---------- inicialização ---------- */
render();
(async()=>{
  try{ db = await window.__conectar(); }catch(e){ console.error(e); db=null; } if(db){ UI.tab=window.__rbac.primeiraAba(UI.tab); if(window.__ext) window.__ext.conectar(); render(); if(window.__rbac.usaPainelRpc()) window.__rbac.painelDados().then(d=>{ PD=d; render(); }).catch(console.error); }
  if(!db){ const n=document.getElementById('notice'); n.textContent='Sem acesso ao banco de dados. Entre com um e-mail autorizado para ver e gravar os dados.'; n.hidden=false; S.loaded={a:true,l:true,f:true,q:true}; render(); return; }
  const sub=(col,key,flag)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({...d.data(),id:d.id})); S.loaded[flag]=true; if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.line&&!document.activeElement.dataset.dv) render(); },e=>console.error(col,e));
  sub('agregados','agregados','a'); sub('locacoes','locacoes','l'); sub('feriados','feriados','f'); sub('custos','custos','c');
  db.collection('fech').onSnapshot(snap=>{ S.fech=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})); S.loaded.q=true; if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.line&&!document.activeElement.dataset.dv) render(); },e=>console.error(e));
  db.collection('nfs').onSnapshot(snap=>{ S.nfs=snap.docs.filter(d=>!String(d.id).startsWith('__')).map(d=>({...d.data(),id:d.id})); const ae=document.activeElement; if(!(ae&&ae.dataset&&(ae.dataset.line||ae.dataset.dv))) render(); },e=>console.error('nfs',e));
  db.collection('adiant').onSnapshot(snap=>{ S.adiant=snap.docs.map(d=>({...d.data(),id:d.id})); Object.values(UI.aj).forEach(aj=>{ if(aj&&!(aj.desc||[]).some(x=>x.ad)) delete aj.adQ; }); const ae=document.activeElement; if(!(ae&&ae.dataset&&(ae.dataset.line||ae.dataset.dv))) render(); },e=>console.error('adiant',e));
  db.collection('faltas').onSnapshot(snap=>{ S.faltas=new Map(snap.docs.map(d=>[d.id,d.data()])); const ae=document.activeElement; if(!(ae&&ae.dataset&&(ae.dataset.line||ae.dataset.dv))) render(); },e=>console.error('faltas',e));
  db.doc('config/geral').onSnapshot(s=>{ if(s.exists){ S.config={feriadoRegra:'sabdom',...s.data()}; render(); } },e=>console.error(e));
})();
})();
</script>

<script>
(function(){ const pinta=()=>{ const t=document.documentElement.getAttribute("data-theme")||"auto"; document.querySelectorAll("[data-tema]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tema===t))); };
  document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-tema]"); if(!b) return; const t=b.dataset.tema;
    if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t);
    try{ if(t==="auto") localStorage.removeItem("tema"); else localStorage.setItem("tema",t); }catch(_){} pinta(); });
  pinta(); })();
</script>
